name: CI / CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: make install

      - name: Ruff format
        run: make format-check

      - name: Ruff check
        run: make lint

      - name: Mypy
        run: make mypy

      - name: Tests
        run: make test

  check:
    runs-on: ubuntu-26.04
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Run make build
        run: make build

  docker-publish:
    runs-on: ubuntu-26.04
    if: github.event_name == 'push'
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/olegsklyarov/unn-2026-sklyarov-test:latest
            ghcr.io/olegsklyarov/unn-2026-sklyarov-test:${{ github.sha }}
