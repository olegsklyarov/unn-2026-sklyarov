name: CI / CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Run make build
        run: make build

  docker-publish:
    runs-on: ubuntu-26.04
    if: github.event_name == 'push'
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/olegsklyarov/unn-2026-sklyarov-test:latest
            ghcr.io/olegsklyarov/unn-2026-sklyarov-test:${{ github.sha }}
